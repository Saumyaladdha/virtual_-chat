<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: #f2f2f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { background: #ffffff; border: 0.5px solid #d1d5db; border-radius: 12px; max-width: 340px; width: 100%; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
  .card-header { background: #E1F5EE; padding: 11px 13px 10px; border-bottom: 0.5px solid #5DCAA5; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
  .header-left { display: flex; align-items: center; gap: 6px; }
  .header-icon { width: 26px; height: 26px; border-radius: 7px; background: rgba(159,225,203,0.33); border: 0.5px solid #5DCAA5; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .header-subject { font-size: 12px; font-weight: 500; color: #085041; }
  .header-badge { font-size: 10px; padding: 2px 8px; border-radius: 100px; background: #FAEEDA; color: #633806; border: 0.5px solid rgba(239,159,39,0.25); display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .header-divider { height: 0.5px; background: rgba(93,202,165,0.25); margin-bottom: 8px; }
  .question-label { font-size: 9.5px; font-weight: 500; letter-spacing: 0.4px; text-transform: uppercase; color: #0F6E56; margin-bottom: 3px; }
  .question { font-size: 12.5px; font-weight: 500; color: #04342C; line-height: 1.4; }
  .card-body { padding: 11px 13px; display: flex; flex-direction: column; gap: 9px; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .box { border-radius: 8px; padding: 9px 10px; border: 0.5px solid transparent; }
  .box-wrong { background: #FCEBEB; border-color: #F09595; }
  .box-right { background: #E1F5EE; border-color: #5DCAA5; }
  .box-label { font-size: 10px; font-weight: 500; letter-spacing: 0.3px; text-transform: uppercase; margin-bottom: 5px; display: flex; align-items: center; gap: 4px; }
  .box-wrong .box-label { color: #A32D2D; }
  .box-right .box-label { color: #0F6E56; }
  .box-value { font-size: 15px; font-weight: 500; margin-bottom: 4px; line-height: 1.3; letter-spacing: -0.2px; }
  .box-wrong .box-value { color: #E24B4A; }
  .box-right .box-value { color: #1D9E75; }
  .box-marks { font-size: 10.5px; font-weight: 500; }
  .box-wrong .box-marks { color: #A32D2D; }
  .box-right .box-marks { color: #0F6E56; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot-wrong { background: #E24B4A; }
  .dot-right { background: #1D9E75; }
  .rule { background: rgba(159,225,203,0.13); border-radius: 8px; border: 0.5px solid #5DCAA5; border-left: 2px solid #1D9E75; padding: 8px 10px; font-size: 11.5px; color: #085041; line-height: 1.5; }
  .rule strong { font-weight: 500; color: #04342C; }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="header-top">
      <div class="header-left">
        <div class="header-icon">🧬</div>
        <div><div class="header-subject">जीव विज्ञान · कक्षा १२ · आनुवंशिकी</div></div>
      </div>
      <div class="header-badge">⚠ बोर्ड में आया था</div>
    </div>
    <div class="header-divider"></div>
    <div class="question-label">प्रश्न</div>
    <div class="question">द्विसंकर क्रॉस का फीनोटाइपिक अनुपात क्या होगा?</div>
  </div>
  <div class="card-body">
    <div class="compare">
      <div class="box box-wrong">
        <div class="box-label"><span class="dot dot-wrong"></span> ९०% छात्रों ने</div>
        <div class="box-value">९ : ७</div>
        <div class="box-marks">० / २ अंक</div>
      </div>
      <div class="box box-right">
        <div class="box-label"><span class="dot dot-right"></span> सही उत्तर</div>
        <div class="box-value">९ : ३ : ३ : १</div>
        <div class="box-marks">२ / २ अंक</div>
      </div>
    </div>
    <div class="rule">
      <strong>याद रखो:</strong> ९:७ एपिस्टेसिस का अनुपात है — सामान्य द्विसंकर का नहीं। प्रश्न में "फीनोटाइपिक" या "जीनोटाइपिक" ज़रूर जाँचो।
    </div>
  </div>
</div>
</body>
</html>
