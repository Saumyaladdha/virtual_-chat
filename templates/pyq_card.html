<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.getElementById('pyq-card'),{delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
    ]});"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin: 0; background: #f0f4f8; font-family: 'Kalam', cursive; }
  /* A4 portrait: 794px wide */
  .card {
    background: white;
    border-radius: 20px;
    width: 754px;
    overflow: hidden;
    box-shadow: 0 6px 28px rgba(0,0,0,0.12);
  }
  .card-header {
    background: linear-gradient(135deg, #e8f4f8 0%, #d0edf5 100%);
    padding: 26px 32px 22px;
    border-bottom: 3px solid #4db6ac;
  }
  .header-label {
    font-family: sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: #4db6ac;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .chapter-title {
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: 24px;
    color: #1a237e;
    line-height: 1.3;
  }
  .card-body { padding: 16px 28px 24px; }
  .q-row {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    padding: 14px 0;
    border-bottom: 1px solid #e8edf0;
  }
  .q-row:last-child { border-bottom: none; }
  .q-badge {
    background: #f9c74f;
    color: #1a237e;
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 10px;
    white-space: nowrap;
    min-width: 64px;
    text-align: center;
    margin-top: 2px;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(249,199,79,0.4);
  }
  .q-body {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    border-left: 3px solid #4db6ac;
    padding-left: 16px;
  }
  /* Tables inside question blocks must never overflow the card */
  .q-text table {
    width: 100% !important;
    max-width: 100% !important;
    table-layout: fixed !important;
    font-size: 11px !important;
    font-family: sans-serif !important;
    border-collapse: collapse !important;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .q-text td, .q-text th {
    word-wrap: break-word !important;
    overflow-wrap: break-word !important;
    max-width: 0;
  }
  .q-text div[style*="overflow"] {
    max-width: 100%;
    overflow-x: auto;
  }
  .q-meta {
    font-size: 11px;
    color: #999;
    margin-bottom: 4px;
    font-family: sans-serif;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .q-text {
    font-family: 'Kalam', cursive;
    font-size: 15px;
    color: #1a1a2e;
    line-height: 1.55;
    font-style: italic;
  }
  .q-marks {
    font-size: 12px;
    color: #999;
    font-style: italic;
    font-family: sans-serif;
  }
</style>
</head>
<body>
<div style="padding: 20px; display: inline-block;">
<div class="card" id="pyq-card">
  <div class="card-header">
    <div class="header-label">📋 Board Previous Year Questions</div>
    <div class="chapter-title">{{chapter_title}}</div>
  </div>
  <div class="card-body">
    {{q_blocks}}
  </div>
</div>
</div>
</body>
</html>
